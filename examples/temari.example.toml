version = 4

[model]
base_url = "http://127.0.0.1:11434/v1"
name = "qwen2.5:7b"
allowed_hosts = ["127.0.0.1", "localhost", "::1"]
# api_key_env = "TEMARI_MODEL_API_KEY"
# For a private owner-only config, use `api_key = "..."` instead. Do not set both.

[privacy]
# "ask" prompts once per interactive run only when name classification is ambiguous.
# Use "metadata_only" or "on_demand" for explicit unattended behavior.
content = "ask"
max_content_chars = 20000
max_content_file_bytes = 10485760

[privacy.extraction]
max_output_bytes = 1048576
max_archive_entries = 1024
max_expanded_bytes = 67108864
max_xml_events = 1000000
max_xml_depth = 256
timeout_seconds = 15

