[package]
name = "temari-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "temari_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
temari-core = { path = "../../../crates/temari-core" }
temari-schedule = { path = "../../../crates/temari-schedule" }

[dev-dependencies]
tempfile = "3"

[workspace]
