name: Bug report
description: Report a reproducible Temari problem using synthetic or redacted data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private file names, extracted content, model payloads, workflow artifacts, or unredacted configuration. Report security issues privately as described in SECURITY.md.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Desktop
        - Core/library
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and relevant model server.
      placeholder: NixOS x86_64, Ollama
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Use a minimal test directory and synthetic names.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only redacted diagnostics.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I replaced private data with synthetic examples and removed all credentials.
          required: true
