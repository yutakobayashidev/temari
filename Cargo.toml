[workspace]
members = ["crates/temari-core", "crates/temari-cli", "crates/temari-schedule"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
pdf-extract = "0.12"
quick-xml = "0.41"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "1.3"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
url = "2.5"
wait-timeout = "0.2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
